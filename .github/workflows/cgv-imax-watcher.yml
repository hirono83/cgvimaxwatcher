name: CGV Yongsan Odyssey IMAX Watcher
run-name: "CGV Odyssey IMAX check · ${{ inputs.trigger_source || 'manual' }}"

on:
  workflow_dispatch:
    inputs:
      force:
        description: "검사 시간과 종료일을 무시"
        required: false
        default: false
        type: boolean
      test_notification:
        description: "CGV 조회 대신 텔레그램 테스트 알림 전송"
        required: false
        default: false
        type: boolean
      trigger_source:
        description: "호출 출처 표시"
        required: false
        default: "manual"
        type: string

permissions:
  contents: write

concurrency:
  group: cgv-yongsan-odyssey-imax-watcher
  cancel-in-progress: false

jobs:
  check-booking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest -v
      - name: Show trigger source
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
        run: echo "Triggered by $TRIGGER_SOURCE"


      - name: Check CGV schedule
        shell: bash
        run: |
          args=()
          if [[ "${{ inputs.force }}" == "true" ]]; then
            args+=(--force)
          fi
          if [[ "${{ inputs.test_notification }}" == "true" ]]; then
            args+=(--test-notification)
          fi
          python cgv_imax_watcher.py "${args[@]}"

      - name: Save notification state
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- state.json)" ]]; then
            echo "No state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update CGV notification state"
          git pull --rebase
          git push
